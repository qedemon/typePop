<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TypePop">
  <title>TypePop</title>
  <defs>
    <!-- 앱 배경색(glClearColor 0,0,0.5)을 그대로 쓴다 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2323a8"/>
      <stop offset="0.55" stop-color="#000080"/>
      <stop offset="1" stop-color="#00003d"/>
    </linearGradient>

    <!-- 각도 맵 반사를 흉내 낸 크롬 그라디언트 -->
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#c9d8f2"/>
      <stop offset="0.46" stop-color="#f6faff"/>
      <stop offset="0.62" stop-color="#8fa6cc"/>
      <stop offset="0.82" stop-color="#e8f0fb"/>
      <stop offset="1" stop-color="#93a8cc"/>
    </linearGradient>

    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7ea3"/>
      <stop offset="0.5" stop-color="#3d4c70"/>
      <stop offset="1" stop-color="#232f4c"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 글자 T 의 앞면 -->
    <path id="T" d="M322 290 H702 V380 H570 V710 H454 V380 H322 Z"/>

    <clipPath id="plate">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#plate)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <g transform="rotate(-10 512 500)">
      <!-- 옆면: 같은 모양을 조금씩 밀어 겹쳐 두께를 만든다 -->
      <g fill="url(#side)">
        <use href="#T" transform="translate(4 3.4)"/>
        <use href="#T" transform="translate(8 6.8)"/>
        <use href="#T" transform="translate(12 10.2)"/>
        <use href="#T" transform="translate(16 13.6)"/>
        <use href="#T" transform="translate(20 17)"/>
        <use href="#T" transform="translate(24 20.4)"/>
        <use href="#T" transform="translate(28 23.8)"/>
        <use href="#T" transform="translate(32 27.2)"/>
        <use href="#T" transform="translate(36 30.6)"/>
        <use href="#T" transform="translate(40 34)"/>
        <use href="#T" transform="translate(44 37.4)"/>
        <use href="#T" transform="translate(48 40.8)"/>
        <use href="#T" transform="translate(52 44.2)"/>
        <use href="#T" transform="translate(56 47.6)"/>
        <use href="#T" transform="translate(60 51)"/>
        <use href="#T" transform="translate(64 54.4)"/>
        <use href="#T" transform="translate(68 57.8)"/>
      </g>
      <!-- 앞면 -->
      <use href="#T" fill="url(#face)"/>
      <use href="#T" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    </g>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="183"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
